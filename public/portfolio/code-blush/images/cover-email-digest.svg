<svg xmlns="http://www.w3.org/2000/svg" width="350" height="578" viewBox="0 0 350 578" fill="none">
  <title>Daily Email Digest - Gmail to Gemini to Slack, every morning</title>
  <rect width="350" height="578" rx="16" fill="#FF5E00"/>

  <text x="175" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" letter-spacing="2.2" fill="#ffffff" fill-opacity=".75">N8N &#183; RUNS ITSELF, EVERY MORNING</text>

  <!-- the wire -->
  <g stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-opacity=".55" fill="none">
    <path d="M175 142 Q170 160 175 176" stroke-dasharray="1 8"/>
    <path d="M175 284 Q181 298 175 310" stroke-dasharray="1 8"/>
    <path d="M175 432 Q169 444 175 452" stroke-dasharray="1 8"/>
  </g>

  <!-- 6:00 alarm -->
  <g transform="translate(158 108)">
    <circle r="26" stroke="#ffffff" stroke-width="2.4" fill="none"/>
    <path d="M-19 -19 L-27 -27M19 -19 L27 -27" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0 -14 V1 L11 8" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle r="2.4" fill="#ffffff"/>
    <text x="40" y="6" font-family="Georgia, serif" font-size="21" fill="#ffffff">6:00 am</text>
  </g>

  <!-- unread mail -->
  <g transform="translate(175 214) rotate(-1.4)">
    <rect x="-58" y="-38" width="116" height="76" rx="9" stroke="#ffffff" stroke-width="2.4" fill="none"/>
    <path d="M-58 -30 L0 8 L58 -30" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    <path d="M-58 30 L-20 -2M58 30 L20 -2" stroke="#ffffff" stroke-width="2" stroke-opacity=".5" stroke-linecap="round"/>
    <g transform="translate(54 -36)">
      <circle r="15.5" fill="#ffffff"/>
      <text y="5" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#FF5E00">27</text>
    </g>
  </g>
  <text x="175" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" letter-spacing="1.7" fill="#ffffff" fill-opacity=".85">GMAIL &#183; UNREAD</text>

  <!-- the model -->
  <g transform="translate(175 356) rotate(1.2)">
    <rect x="-50" y="-44" width="100" height="88" rx="14" stroke="#ffffff" stroke-width="2.4" fill="none"/>
    <path d="M-5 -28 C-3 -13 3 -7 18 -5 C3 -3 -3 3 -5 18 C-7 3 -13 -3 -28 -5 C-13 -7 -7 -13 -5 -28 Z" fill="#ffffff"/>
    <path d="M23 -23 C24 -17 27 -14 33 -13 C27 -12 24 -9 23 -3 C22 -9 19 -12 13 -13 C19 -14 22 -17 23 -23 Z" fill="#ffffff" fill-opacity=".7"/>
    <g fill="#ffffff" fill-opacity=".55">
      <rect x="-32" y="22" width="54" height="4.5" rx="2.2"/>
      <rect x="-32" y="32" width="34" height="4.5" rx="2.2"/>
    </g>
  </g>
  <text x="175" y="424" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" letter-spacing="1.7" fill="#ffffff" fill-opacity=".85">GEMINI &#183; SUMMARISE</text>

  <!-- posted to slack -->
  <g transform="translate(175 504) rotate(-0.9)">
    <rect x="-113" y="-52" width="226" height="104" rx="12" fill="#ffffff"/>
    <rect x="-96" y="-38" width="26" height="26" rx="7" fill="#FF5E00"/>
    <text x="-62" y="-27" font-family="Georgia, serif" font-size="15" fill="#FF5E00">Your morning digest</text>
    <text x="-62" y="-13" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1.1" fill="#3B4AD6">9:02 AM &#183; #daily-digest</text>
    <g fill="#3B4AD6" fill-opacity=".35">
      <rect x="-92" y="4" width="186" height="5" rx="2.5"/>
      <rect x="-92" y="17" width="162" height="5" rx="2.5"/>
      <rect x="-92" y="30" width="176" height="5" rx="2.5"/>
      <rect x="-92" y="43" width="106" height="5" rx="2.5"/>
    </g>
    <g fill="#FF5E00">
      <circle cx="-100" cy="6.5" r="2.6"/>
      <circle cx="-100" cy="19.5" r="2.6"/>
      <circle cx="-100" cy="32.5" r="2.6"/>
      <circle cx="-100" cy="45.5" r="2.6"/>
    </g>
  </g>
</svg>
