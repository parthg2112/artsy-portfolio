<svg xmlns="http://www.w3.org/2000/svg" width="538" height="634" viewBox="0 0 538 634" fill="none">
  <title>n8n Workflows - form capture, sheet, conditional branch, personalised mail</title>
  <defs>
    <pattern id="n8n-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#3B4AD6" fill-opacity=".18"/>
    </pattern>
  </defs>
  <rect width="538" height="634" rx="18" fill="#fbf3d4"/>
  <rect x="14" y="14" width="510" height="606" rx="10" fill="url(#n8n-dots)"/>

  <text x="44" y="58" font-family="system-ui, sans-serif" font-size="10.5" letter-spacing="2.2" fill="#3B4AD6" fill-opacity=".8">ONE WORKFLOW &#183; NOBODY TOUCHES IT</text>

  <!-- wires -->
  <g fill="none" stroke-linecap="round">
    <path d="M126 138 C126 176 196 168 196 202" stroke="#3B4AD6" stroke-width="2.2"/>
    <path d="M290 264 C290 292 276 288 276 316" stroke="#3B4AD6" stroke-width="2.2"/>
    <path d="M214 388 C160 400 138 414 138 452" stroke="#FF5E00" stroke-width="2.6"/>
    <path d="M338 388 C400 400 418 414 418 452" stroke="#3B4AD6" stroke-width="2.2" stroke-dasharray="6 6"/>
  </g>
  <g fill="#3B4AD6">
    <circle cx="126" cy="138" r="4"/>
    <circle cx="196" cy="202" r="4"/>
    <circle cx="290" cy="264" r="4"/>
    <circle cx="276" cy="316" r="4"/>
    <circle cx="418" cy="452" r="4"/>
  </g>
  <circle cx="138" cy="452" r="4.5" fill="#FF5E00"/>

  <!-- trigger -->
  <g transform="translate(44 86) rotate(-1)">
    <rect width="164" height="52" rx="12" fill="#ffffff" stroke="#3B4AD6" stroke-width="2.2"/>
    <path d="M20 18 H40M20 26 H40M20 34 H33" stroke="#3B4AD6" stroke-width="2" stroke-linecap="round"/>
    <rect x="14" y="12" width="32" height="28" rx="5" stroke="#3B4AD6" stroke-width="1.6" stroke-opacity=".4" fill="none"/>
    <text x="58" y="26" font-family="Georgia, serif" font-size="16" fill="#3B4AD6">Form submit</text>
    <text x="58" y="40" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1.3" fill="#FF5E00">TRIGGER</text>
  </g>

  <!-- sheet -->
  <g transform="translate(196 202) rotate(0.8)">
    <rect width="188" height="62" rx="12" fill="#ffffff" stroke="#3B4AD6" stroke-width="2.2"/>
    <g stroke="#3B4AD6" stroke-width="1.6" stroke-opacity=".55">
      <rect x="16" y="16" width="34" height="30" rx="4" fill="none"/>
      <path d="M16 26 H50M33 16 V46"/>
    </g>
    <rect x="16" y="16" width="17" height="10" fill="#3B4AD6" fill-opacity=".25"/>
    <text x="62" y="30" font-family="Georgia, serif" font-size="16" fill="#3B4AD6">Append row</text>
    <text x="62" y="45" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1.3" fill="#3B4AD6" fill-opacity=".65">GOOGLE SHEETS</text>
  </g>

  <!-- condition -->
  <g transform="translate(276 352)">
    <path d="M0 -40 L86 0 L0 40 L-86 0 Z" fill="#ffffff" stroke="#3B4AD6" stroke-width="2.4" stroke-linejoin="round"/>
    <text y="-2" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#3B4AD6">new lead?</text>
    <text y="16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1.4" fill="#3B4AD6" fill-opacity=".6">IF</text>
  </g>
  <text x="206" y="416" text-anchor="end" font-family="system-ui, sans-serif" font-size="10" letter-spacing="1.5" fill="#FF5E00">TRUE</text>
  <text x="350" y="416" font-family="system-ui, sans-serif" font-size="10" letter-spacing="1.5" fill="#3B4AD6" fill-opacity=".7">FALSE</text>

  <!-- personalised mail -->
  <g transform="translate(44 452) rotate(-1.2)">
    <rect width="208" height="76" rx="13" fill="#FF5E00"/>
    <g transform="translate(20 26)">
      <rect x="0" y="-11" width="34" height="24" rx="4" stroke="#ffffff" stroke-width="2" fill="none"/>
      <path d="M0 -8 L17 5 L34 -8" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" fill="none"/>
    </g>
    <text x="66" y="30" font-family="Georgia, serif" font-size="16" fill="#ffffff">Send mail</text>
    <text x="66" y="43" font-family="system-ui, sans-serif" font-size="8.5" letter-spacing="1.1" fill="#ffffff" fill-opacity=".8">GMAIL &#183; PERSONALISED</text>
    <rect x="20" y="50" width="130" height="17" rx="8.5" fill="#ffffff" fill-opacity=".24"/>
    <text x="30" y="62" font-family="system-ui, sans-serif" font-size="9.5" fill="#ffffff">Hi {{ first_name }}</text>
  </g>

  <!-- no-op branch -->
  <g transform="translate(340 452) rotate(1)">
    <rect width="154" height="60" rx="13" fill="#ffffff" stroke="#3B4AD6" stroke-width="2.2" stroke-dasharray="7 6"/>
    <path d="M24 30 h20M34 20 v20" stroke="#3B4AD6" stroke-width="2.2" stroke-linecap="round" stroke-opacity=".5" transform="rotate(45 34 30)"/>
    <text x="58" y="27" font-family="Georgia, serif" font-size="15" fill="#3B4AD6">Skip</text>
    <text x="58" y="42" font-family="system-ui, sans-serif" font-size="9" letter-spacing="1.3" fill="#3B4AD6" fill-opacity=".6">ALREADY LOGGED</text>
  </g>

  <text x="44" y="578" font-family="Georgia, serif" font-size="24" fill="#FF5E00">Capture &#8594; route &#8594; reply</text>
  <path d="M44 590 Q160 598 300 589" stroke="#FF5E00" stroke-width="2.2" stroke-linecap="round" fill="none" stroke-opacity=".5"/>
</svg>
