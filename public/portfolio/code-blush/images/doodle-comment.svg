<svg xmlns="http://www.w3.org/2000/svg" width="378" height="340" viewBox="0 0 378 340" fill="none">
  <title>A hand-drawn ring around a greeting</title>
  <!-- A brush ring, not an ellipse: overlapping arcs of different weight, with gaps
       and a dry-brush tail, so the line reads as drawn rather than plotted. -->
  <g stroke="#3B4AD6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226 28c86 14 130 74 122 146-8 70-76 128-166 126" stroke-width="9.5"/>
    <path d="M178 300c-84-6-146-62-148-134C28 96 92 30 178 24" stroke-width="5"/>
    <path d="M188 22c16-1 30 0 44 3" stroke-width="3"/>
    <path d="M62 88C40 116 32 148 34 178c2 42 24 76 58 96" stroke-width="7" opacity="0.55"/>
    <path d="M330 216c-10 34-36 60-70 74" stroke-width="2.5" opacity="0.75"/>

    <!-- the greeting, weighted like a felt tip -->
    <path d="M100 208 126 128" stroke-width="9"/>
    <path d="M134 208 160 128" stroke-width="8"/>
    <path d="M202 118 199 208" stroke-width="8"/>
    <path d="M199.5 170c7.5-18 28.5-21 35.5-5 3.5 8 1.5 26 .5 43" stroke-width="7"/>
    <path d="M268 162l-4 46" stroke-width="7.5"/>
  </g>
  <circle cx="271" cy="147" r="6.5" fill="#3B4AD6"/>
</svg>
