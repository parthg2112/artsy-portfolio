<svg xmlns="http://www.w3.org/2000/svg" width="70" height="112" viewBox="0 0 70 112" fill="none">
  <title>A lightbulb hanging from a thread</title>
  <defs>
    <linearGradient id="bulbGlass" x1="18" y1="10" x2="56" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F2E6"/>
      <stop offset="0.55" stop-color="#EBECB0"/>
      <stop offset="1" stop-color="#D6D88C"/>
    </linearGradient>
    <linearGradient id="bulbBase" x1="26" y1="76" x2="48" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5E00"/>
      <stop offset="1" stop-color="#C24700"/>
    </linearGradient>
    <radialGradient id="bulbGlow" cx="0.38" cy="0.34" r="0.5">
      <stop offset="0" stop-color="#F7F2E6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F7F2E6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- glass -->
  <path d="M35 6c-15.5 0-27 11.4-27 26 0 9.7 4.6 16.2 9.6 21.4 3.6 3.8 5.6 7.3 6.3 12.2h22.2c.7-4.9 2.7-8.4 6.3-12.2C57.4 48.2 62 41.7 62 32 62 17.4 50.5 6 35 6Z"
        fill="url(#bulbGlass)" stroke="#3B4AD6" stroke-width="2.6"/>
  <ellipse cx="27" cy="27" rx="10" ry="13" fill="url(#bulbGlow)"/>

  <!-- filament, drawn thinner than the outline so the glass reads as glass -->
  <path d="M27 44c0-6 2.5-8 4-11 1.5 3 2.5 6.5 4 6.5s2.5-3.5 4-6.5c1.5 3 4 5 4 11"
        stroke="#FF5E00" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M28.5 66h13" stroke="#3B4AD6" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>

  <!-- screw base -->
  <path d="M22.6 71.5h24.8a3 3 0 0 1 3 3.4l-2.8 20.6a8 8 0 0 1-7.9 6.9h-9.4a8 8 0 0 1-7.9-6.9l-2.8-20.6a3 3 0 0 1 3-3.4Z"
        fill="url(#bulbBase)" stroke="#3B4AD6" stroke-width="2.2"/>
  <path d="M21.4 79h27.2M22.4 86h25.2M24 93h22" stroke="#3B4AD6" stroke-width="1.5" stroke-linecap="round" opacity="0.65"/>
</svg>
